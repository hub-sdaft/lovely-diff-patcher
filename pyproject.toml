[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lovely-diff-patcher"
dynamic = ["version"]
authors = [
    {name="hub-sdaft"}
]
description = "Python utility for patching files with Lovely Injector"
readme = "README.md"
requires-python=">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/hub-sdaft/lovely-diff-patcher"
Issues = "https://github.com/hub-sdaft/lovely-diff-patcher/issues"

[project.scripts]
lovely-diff-patcher = "lovely_diff_patcher:cli_main"

[tool.setuptools.dynamic]
version = { attr = "lovely_diff_patcher.__version__"}
